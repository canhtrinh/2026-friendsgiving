<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friendsgiving 2026 Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Josefin+Sans:wght@300&display=swap">
<style>
/* Layout: one centered column; the four folded-card pages stacked in reading order, actions at the end */
:root{
  --paper:#F7F4EE; --ink:#1F1A14; --muted:#5C5346; --gold:#7A5C24; --line:#D9CFBE; --shadow:rgba(31,26,20,.14);
  --serif:'EB Garamond',Georgia,'Times New Roman',serif; --display:'Josefin Sans','Futura','Avenir',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#16120D;--ink:#EEE6D6;--muted:#B8AC98;--gold:#D2AE68;--line:#3A3127;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#16120D;--ink:#EEE6D6;--muted:#B8AC98;--gold:#D2AE68;--line:#3A3127;--shadow:rgba(0,0,0,.5);color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.24em;color:var(--gold);margin:0}
.hint{margin:0;color:var(--muted);font-style:italic;font-size:15px}
.pages{display:flex;flex-direction:column;gap:22px;width:100%;align-items:center}
figure{margin:0;width:100%;max-width:528px;display:flex;flex-direction:column;gap:8px}
figure img{width:100%;height:auto;display:block;background:#fff;box-shadow:0 10px 30px var(--shadow)}
figcaption{font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:700 13px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;padding:14px 20px;min-height:44px;display:inline-flex;align-items:center;border:1.5px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--gold);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn:disabled{opacity:.6;cursor:default}
.note{margin:0;font-size:15px;color:var(--muted);font-style:italic;min-height:1.5em}
</style>

</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">THE EIGHTEENTH ANNUAL FRIENDSGIVING</p>
    <p class="hint">November 21, 2026 · Scroll through tonight’s menu</p>
  </header>

  <div class="pages">
    <figure><img src="1-front.png?v=1795267238" alt="Front cover: The Eighteenth Annual Friendsgiving, est. 2009, hosted by Canh, Mike and Dori, November 21, 2026, at the Cipriani Building, 55 Wall Street." width="1584" height="2448"></figure>
    <figure><img src="2-cocktails.png?v=1795267238" alt="Cocktails, with arrivals at three and cocktails from four to six o’clock: appetizers, the signature punch, wines, non-alcoholic drinks and 2026 Reflections." width="1584" height="2448" loading="lazy"></figure>
    <figure><img src="3-dinner.png?v=1795267238" alt="Dinner, six to eleven o’clock: starters and entrées, sides and desserts." width="1584" height="2448" loading="lazy"></figure>
    <figure><img src="4-back.png?v=1795267238" alt="Back cover: the guest list, an Emerson quote, and an invitation to the Life Updates Among Friends WhatsApp group." width="1584" height="2448" loading="lazy"></figure>
  </div>

  <div class="actions">
    <a class="btn primary" href="https://chat.whatsapp.com/D5CSVir68uOCUSzskyhXOu?mode=gi_t" target="_blank" rel="noopener">Join the WhatsApp group</a>
    <a class="btn" href="friendsgiving-2026-menu.pdf?v=1795267238" download="Friendsgiving 2026 Menu.pdf">Download PDF</a>
  </div>
  <p class="note" id="note">To keep a copy, press and hold any page and choose Save Image.</p>
</main>

</body>
</html>
